pluginManagement {
    repositories {
        maven { url = 'https://maven.muon.rip/releases' }
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        gradlePluginPortal()
    }
}

plugins {
    id('org.gradle.toolchains.foojay-resolver-convention') version '1.0.0'
}

rootProject.name = 'RoguelikeDungeons-Arcana'
include 'roguelike-core'
include '1.12'
