version = "3.0.0"
group = "com.github.apocollis"

subprojects {
    apply plugin: 'java'
    group = 'com.github.apocollis'
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Java 21 bytecode (class major 65). Mixin/Fugue refuse 66+, so do not raise this.
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }
}
