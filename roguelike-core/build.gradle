apply plugin: 'java-library'

base {
    archivesName = "RoguelikeCore"
}

dependencies {
    // Cleanroom provides these at runtime. Core has no Minecraft on its classpath, so they are
    // compileOnly here (and on the test classpath), pinned to the versions the DEVBOX Cleanroom
    // (0.6.13-alpha, ~/.cleanroom/relauncher/0.6.13-alpha/*.json) loads.
    compileOnly 'com.google.code.gson:gson:2.14.0'
    compileOnly 'com.google.guava:guava:33.6.0-jre'
    compileOnly 'commons-io:commons-io:2.22.0'
    compileOnly 'org.apache.commons:commons-lang3:3.20.0'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.26.0'

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"

    testImplementation "junit:junit:${junit_version}"
    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testImplementation "org.assertj:assertj-core:${assertj_version}"
}

// The test classpath needs the same libraries Cleanroom provides at runtime.
configurations.testImplementation.extendsFrom(configurations.compileOnly)
